name: ai-resume-analyser
description: >
  Production-grade Helm chart for the AI Resume Analyser platform.
  Deploys a FastAPI backend, Celery worker, and nginx-served React frontend.
  Relies on external AWS RDS (PostgreSQL) and ElastiCache (Redis).

