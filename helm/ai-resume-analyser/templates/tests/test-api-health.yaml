apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ai-resume-analyser.fullname" . }}-test-api-health
  namespace: {{ include "ai-resume-analyser.namespace" . }}
  labels:
    {{- include "ai-resume-analyser.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-api-health
      image: curlimages/curl:8.6.0
      command:
        - sh
        - -c
        - |
          set -e
          echo "=== AI Resume Analyser — Helm Test Suite ==="
          echo ""

          API_URL="http://{{ include "ai-resume-analyser.fullname" . }}-api.{{ include "ai-resume-analyser.namespace" . }}.svc.cluster.local"

          # Test 1: Liveness probe
          echo "[1/4] Testing liveness endpoint (/api/v1/healthz)..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/healthz")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/v1/healthz returned HTTP ${STATUS}"
            exit 1
          fi
          echo "PASS: /api/v1/healthz returned HTTP 200"

          # Test 2: Readiness probe
          echo "[2/4] Testing readiness endpoint (/api/v1/readyz)..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/readyz")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/v1/readyz returned HTTP ${STATUS}"
            exit 1
          fi
          echo "PASS: /api/v1/readyz returned HTTP 200"

          # Test 3: OpenAPI docs endpoint
          echo "[3/4] Testing OpenAPI docs endpoint (/api/v1/docs)..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/docs")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/v1/docs returned HTTP ${STATUS}"
            exit 1
          fi
          echo "PASS: /api/v1/docs returned HTTP 200"

          # Test 4: Prometheus metrics endpoint
          echo "[4/4] Testing Prometheus metrics endpoint (/metrics)..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${API_URL}/metrics")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /metrics returned HTTP ${STATUS}"
            exit 1
          fi
          echo "PASS: /metrics returned HTTP 200"

          echo ""
          echo "=== All tests passed ==="
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
