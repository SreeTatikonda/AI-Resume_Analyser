{{- if .Values.monitoring.serviceMonitor.enabled }}
# ServiceMonitor for Prometheus Operator.
# Requires prometheus-operator (or kube-prometheus-stack) to be installed in the cluster.
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-resume-analyser.fullname" . }}-api
  namespace: {{ .Values.monitoring.serviceMonitor.namespace | default "monitoring" }}
  labels:
    {{- include "ai-resume-analyser.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "ai-resume-analyser.namespace" . }}
  selector:
    matchLabels:
      {{- include "ai-resume-analyser.componentSelectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.serviceMonitor.port | default "http" | quote }}
      path: {{ .Values.monitoring.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
      scheme: http
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
{{- end }}
