{{/*
Secret template for AI Resume Analyser.

In production, use External Secrets Operator (ESO) to sync secrets from AWS Secrets Manager.
Set externalSecrets.enabled=true in values-prod.yaml and this plain Secret will be skipped.

When externalSecrets.enabled=false (dev/test), a plain Kubernetes Secret is created from
the values.secrets map. NEVER commit real secret values to version control.

Recommended production pattern with ESO:
  helm upgrade --install ai-resume-analyser . \
    -f values-prod.yaml \
    --set externalSecrets.enabled=true \
    --set externalSecrets.remoteSecretPath=prod/resume-analyser
*/}}
{{- if not .Values.externalSecrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-resume-analyser.fullname" . }}-secrets
  namespace: {{ include "ai-resume-analyser.namespace" . }}
  labels:
    {{- include "ai-resume-analyser.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    # Remove the annotation above if you want helm uninstall to delete the secret.
    # Keeping secrets on uninstall prevents accidental data loss.
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- else }}
---
# External Secret — syncs from AWS Secrets Manager via External Secrets Operator.
# Install ESO first:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-resume-analyser.fullname" . }}-secrets
  namespace: {{ include "ai-resume-analyser.namespace" . }}
  labels:
    {{- include "ai-resume-analyser.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "ai-resume-analyser.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: redis_url
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: celery_broker_url
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: celery_result_backend
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: secret_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: openai_api_key
{{- end }}
