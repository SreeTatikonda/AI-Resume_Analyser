apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-resume-analyser.fullname" . }}-config
  namespace: {{ include "ai-resume-analyser.namespace" . }}
  labels:
    {{- include "ai-resume-analyser.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
