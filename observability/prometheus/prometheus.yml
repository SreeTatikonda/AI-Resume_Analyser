global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: ai-resume-analyser
    environment: local

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 5s
      api_version: v2

# Load alert rules
rule_files:
  - alerts.yml

# ──────────────────────────────────────────────────────────────
# Scrape configurations
# ──────────────────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
    relabel_configs:
      - target_label: instance
        replacement: prometheus

  # ── FastAPI application (api service) ──────────────────────
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels:
          service: api
          component: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: api

  # ── Celery worker — exposes prometheus_client on port 8001 ─
  # (worker must start prometheus_client.start_http_server(8001))
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8001]
        labels:
          service: worker
          component: celery
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: worker

  # ── Kubernetes pod auto-discovery ─────────────────────────
  # Enable when deploying to Kubernetes. Scrapes pods annotated with:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "8000"
  #   prometheus.io/path: "/metrics"
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        # Optional: restrict to specific namespace
        # namespaces:
        #   names: [resume-analyser]
    relabel_configs:
      # Only scrape pods with the annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Use the annotated port
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Use the annotated path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Carry through useful labels
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # ── Kubernetes services auto-discovery ─────────────────────
  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: service
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service

  # ── Node Exporter (commented — enable in Kubernetes / bare-metal) ──
  # - job_name: node-exporter
  #   static_configs:
  #     - targets:
  #         - node-exporter:9100
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance

  # ── Redis Exporter — Celery queue depth ────────────────────
  # Enables the `redis_list_length` metric used in WorkerQueueGrowing alert
  # and the queue depth panel in Grafana.
  - job_name: redis-exporter
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          service: redis
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: redis

  # ── Postgres Exporter ──────────────────────────────────────
  # - job_name: postgres-exporter
  #   static_configs:
  #     - targets: [postgres-exporter:9187]
  #       labels:
  #         service: postgres
