apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: resume-analyser

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - networkpolicy.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - worker-deployment.yaml
  - worker-hpa.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

# Common labels applied to ALL resources
commonLabels:
  app.kubernetes.io/part-of: ai-resume-analyser
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  kustomize.config.k8s.io/last-applied: "base"
