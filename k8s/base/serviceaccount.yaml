apiVersion: v1
kind: ServiceAccount
metadata:
  name: resume-analyser-api
  namespace: resume-analyser
  labels:
    app.kubernetes.io/name: resume-analyser-api
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # ---------------------------------------------------------------------------
    # IRSA — IAM Roles for Service Accounts (EKS)
    # ---------------------------------------------------------------------------
    # Replace the placeholder ARN below with the actual IAM role ARN created for
    # this service account.  The role must trust the OIDC provider of the EKS
    # cluster and have the following IAM permissions:
    #
    #   - s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket
    #     (on the S3_BUCKET resource)
    #   - bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream
    #     (if using LLM_PROVIDER=bedrock)
    #   - secretsmanager:GetSecretValue
    #     (if using AWS Secrets Manager via External Secrets Operator)
    #
    # Create role with eksctl:
    #   eksctl create iamserviceaccount \
    #     --cluster <cluster-name> \
    #     --namespace resume-analyser \
    #     --name resume-analyser-api \
    #     --attach-policy-arn arn:aws:iam::<ACCOUNT_ID>:policy/ResumeAnalyserApiPolicy \
    #     --approve
    # ---------------------------------------------------------------------------
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ACCOUNT_ID:role/ResumeAnalyserApiRole"
automountServiceAccountToken: true
