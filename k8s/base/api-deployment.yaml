apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-analyser-api
  namespace: resume-analyser
  labels:
    app.kubernetes.io/name: resume-analyser-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Prometheus auto-discovery annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-analyser-api
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime: always keep all current pods up during rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-analyser-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ai-resume-analyser
        app.kubernetes.io/version: "latest"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Force pod restart when configmap/secret changes (hash injected by kustomize or CI)
        checksum/configmap: "placeholder-replaced-by-ci"
        checksum/secret: "placeholder-replaced-by-ci"
    spec:
      serviceAccountName: resume-analyser-api

      # Security: non-root user, drop all capabilities
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across AZs for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: resume-analyser-api

      # Anti-affinity: prefer different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: resume-analyser-api
                topologyKey: kubernetes.io/hostname

      # Init container: run Alembic migrations before API starts
      initContainers:
        - name: alembic-migrate
          image: ${REGISTRY}/resume-analyser-api:${TAG}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: resume-analyser-config
            - secretRef:
                name: resume-analyser-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Alembic writes .pyc files
            capabilities:
              drop: ["ALL"]

      containers:
        - name: api
          image: ${REGISTRY}/resume-analyser-api:${TAG}
          command: ["./scripts/run_prod.sh"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Environment from ConfigMap (non-sensitive)
          envFrom:
            - configMapRef:
                name: resume-analyser-config
            - secretRef:
                name: resume-analyser-secrets

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is FALSE because HuggingFace/sentence-transformers
            # writes model cache to ~/.cache/hf at runtime.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          # Liveness probe — restart if the app is deadlocked
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe — remove from service endpoint pool if not ready
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Startup probe — give the app extra time on cold start (model loading)
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12   # 12 * 10s = 2 minutes max startup time

          # Volume mounts
          volumeMounts:
            - name: hf-cache
              mountPath: /home/app/.cache/hf
            - name: tmp
              mountPath: /tmp

      volumes:
        # emptyDir for HuggingFace model cache (ephemeral; use a PVC + node affinity
        # for persistent caching across restarts in production to avoid re-downloads)
        - name: hf-cache
          emptyDir:
            sizeLimit: 5Gi
        # Writable /tmp for gunicorn worker temporary files
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

      terminationGracePeriodSeconds: 60
      restartPolicy: Always

      # Only schedule on nodes labelled workload=api (optional; remove if not using node groups)
      # nodeSelector:
      #   workload: api
