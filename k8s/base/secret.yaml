apiVersion: v1
kind: Secret
metadata:
  name: resume-analyser-secrets
  namespace: resume-analyser
  labels:
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # If using External Secrets Operator, this secret is managed automatically.
    # Remove this Secret manifest and replace with ExternalSecret + SecretStore.
    managed-by-external-secrets: "false"
type: Opaque
stringData:
  # ---- Database (AWS RDS) ----
  DATABASE_URL: "postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@REPLACE_RDS_ENDPOINT:5432/resume_analyser"

  # ---- Redis (AWS ElastiCache) ----
  REDIS_URL: "redis://REPLACE_ELASTICACHE_ENDPOINT:6379/0"
  CELERY_BROKER_URL: "redis://REPLACE_ELASTICACHE_ENDPOINT:6379/1"
  CELERY_RESULT_BACKEND: "redis://REPLACE_ELASTICACHE_ENDPOINT:6379/2"

  # ---- Application ----
  SECRET_KEY: "REPLACE_WITH_64_CHAR_RANDOM_SECRET"

  # ---- OpenAI ----
  OPENAI_API_KEY: "REPLACE_OPENAI_API_KEY"
