apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-analyser-config
  namespace: resume-analyser
  labels:
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
data:
  # ---- Application ----
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

  # ---- LLM / Embedding ----
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4o-mini"
  EMBEDDING_PROVIDER: "local"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

  # ---- AWS ----
  AWS_REGION: "us-east-1"
  S3_BUCKET: "ai-resume-analyser-prod"

  # ---- Celery ----
  # CELERY_BROKER_URL and CELERY_RESULT_BACKEND are in the Secret (contain credentials)

  # ---- CORS ----
  CORS_ORIGINS: "https://resume-analyser.example.com"

  # ---- Observability ----
  PROMETHEUS_ENABLED: "true"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
