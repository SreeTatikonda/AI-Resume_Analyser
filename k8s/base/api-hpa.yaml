apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-analyser-api
  namespace: resume-analyser
  labels:
    app.kubernetes.io/name: resume-analyser-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-analyser-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale on CPU utilisation
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on memory utilisation (secondary metric)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down to avoid flapping
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
