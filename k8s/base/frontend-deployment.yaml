apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-analyser-frontend
  namespace: resume-analyser
  labels:
    app.kubernetes.io/name: resume-analyser-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-resume-analyser
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-analyser-frontend
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-analyser-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ai-resume-analyser
        app.kubernetes.io/version: "latest"
    spec:
      # Frontend pods do not need AWS credentials
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx official image uses uid 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: resume-analyser-frontend

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: resume-analyser-frontend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: frontend
          image: ${REGISTRY}/resume-analyser-frontend:${TAG}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            # nginx needs to write cache, pid, and temp files even with readOnlyRootFilesystem
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30
      restartPolicy: Always
