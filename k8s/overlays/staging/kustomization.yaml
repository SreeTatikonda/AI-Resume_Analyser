apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: resume-analyser-staging

resources:
  - ../../base

patches:
  # --- Namespace patch ---
  - target:
      kind: Namespace
      name: resume-analyser
    patch: |-
      - op: replace
        path: /metadata/name
        value: resume-analyser-staging

  # --- API: 2 replicas in staging (matches prod for accurate load testing) ---
  - target:
      kind: Deployment
      name: resume-analyser-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # --- Worker: 2 replicas in staging ---
  - target:
      kind: Deployment
      name: resume-analyser-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # --- Frontend: 2 replicas in staging ---
  - target:
      kind: Deployment
      name: resume-analyser-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # --- HPA: moderate scale range for staging ---
  - target:
      kind: HorizontalPodAutoscaler
      name: resume-analyser-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6

  - target:
      kind: HorizontalPodAutoscaler
      name: resume-analyser-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

  # --- Ingress: staging hostname, internal ALB ---
  - target:
      kind: Ingress
      name: resume-analyser
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.resume-analyser.example.com
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        value: internal

  # --- ConfigMap: staging-specific env vars ---
  - target:
      kind: ConfigMap
      name: resume-analyser-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: staging
      - op: replace
        path: /data/LOG_LEVEL
        value: INFO
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://staging.resume-analyser.example.com"
      - op: replace
        path: /data/S3_BUCKET
        value: ai-resume-analyser-staging

# Image tag overrides for staging
images:
  - name: ${REGISTRY}/resume-analyser-api
    newTag: staging
  - name: ${REGISTRY}/resume-analyser-worker
    newTag: staging
  - name: ${REGISTRY}/resume-analyser-frontend
    newTag: staging
