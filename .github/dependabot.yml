version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      pytest:
        patterns: ["pytest*"]
      ruff-mypy:
        patterns: ["ruff", "mypy", "types-*"]
      llm-clients:
        patterns: ["openai", "boto3", "botocore"]
      fastapi:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*", "slowapi"]

  # npm (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    groups:
      react:
        patterns: ["react", "react-*", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
      ui:
        patterns: ["@radix-ui/*", "lucide-react", "tailwind*", "clsx"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]

  # Terraform
  - package-ecosystem: terraform
    directory: /terraform/envs/dev
    schedule:
      interval: weekly
      day: tuesday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, terraform]

  - package-ecosystem: terraform
    directory: /terraform/envs/prod
    schedule:
      interval: weekly
      day: tuesday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, terraform]

  # Docker base images
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: wednesday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: wednesday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, docker]
