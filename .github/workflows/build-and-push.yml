name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel image pushes

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}   # e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-push:
    name: Build & Push — ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
            dockerfile: backend/Dockerfile
            image_name: ai-resume-analyser/api
            target: runtime

          - component: worker
            context: ./backend
            dockerfile: backend/Dockerfile.worker
            image_name: ai-resume-analyser/worker
            target: ""   # no explicit target needed

          - component: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image_name: ai-resume-analyser/frontend
            target: runtime   # nginx stage

    steps:
      - uses: actions/checkout@v4

      # ── Docker Buildx ──────────────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # ── AWS OIDC credentials ───────────────────────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-build-${{ matrix.component }}

      # ── Login to ECR ───────────────────────────────────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      # ── Compute image tags ─────────────────────────────────────────────────
      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          IMAGE_BASE="${ECR_REGISTRY}/${{ matrix.image_name }}"

          TAGS="${IMAGE_BASE}:${SHA_SHORT},${IMAGE_BASE}:${BRANCH}"

          # If this is a version tag, also tag :latest and :<version>
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS="${TAGS},${IMAGE_BASE}:${VERSION},${IMAGE_BASE}:latest"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

      # ── Docker build & push ────────────────────────────────────────────────
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.version || steps.tags.outputs.sha_short }}

      # ── Trivy image vulnerability scan ────────────────────────────────────
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_short }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"    # fail on HIGH/CRITICAL
        env:
          TRIVY_USERNAME: AWS
          TRIVY_PASSWORD: ${{ env.ECR_PASSWORD }}

      # ── (Optional) Cosign image signing ───────────────────────────────────
      # Uncomment to enable supply-chain provenance:
      #
      # - name: Install cosign
      #   uses: sigstore/cosign-installer@v3
      #
      # - name: Sign image with cosign keyless
      #   run: |
      #     cosign sign --yes \
      #       "${{ steps.tags.outputs.image_base }}@${{ steps.build.outputs.digest }}"
      #   env:
      #     COSIGN_EXPERIMENTAL: "1"

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## Build Summary — ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |" >> "$GITHUB_STEP_SUMMARY"
